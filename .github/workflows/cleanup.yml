name: cleanup

on:
  push:
    branches: [main]

jobs:
  rm:
    if: ${{ contains(github.event.head_commit.message, 'cleanup') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: remove temp files
        run: |
          git config user.name mcbot
          git config user.email mcbot@users.noreply.github.com
          git rm -f --ignore-unmatch diag.txt
          git rm -f --ignore-unmatch .github/workflows/diag-pages.yml
          git rm -f --ignore-unmatch .github/workflows/cleanup.yml
          git commit -m "cleanup temp files" || true
          git push
